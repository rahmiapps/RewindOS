name: RewindOS CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: rewindos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install smoke-test dependency
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Ensure Electron binary is installed
        run: node node_modules/electron/install.js

      - name: Configure Electron sandbox
        run: |
          ELECTRON_BIN="$(node -e "process.stdout.write(require('electron'))")"
          SANDBOX_PATH="$(dirname "$ELECTRON_BIN")/chrome-sandbox"
          test -f "$SANDBOX_PATH"
          sudo chown root:root "$SANDBOX_PATH"
          sudo chmod 4755 "$SANDBOX_PATH"
          stat -c '%U %G %a %n' "$SANDBOX_PATH"

      - run: npm run verify
      - run: npm run audit
      - run: xvfb-run -a npm run smoke
