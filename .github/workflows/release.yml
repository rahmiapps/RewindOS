name: Build RewindOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: rewindos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        run: if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Verify source and tests
        run: npm run verify

      - name: Audit runtime dependencies
        run: npm run audit

      - name: Report build-tool audit findings
        continue-on-error: true
        run: npm run audit:full

      - name: Smoke test
        run: npm run smoke

      - name: Build Windows packages
        run: npm run dist:win

      - name: Create checksums
        shell: pwsh
        run: Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content -Encoding ascii dist/SHA256SUMS-Windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RewindOS-Windows
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Ensure Electron binary is installed
        run: node node_modules/electron/install.js

      - name: Configure Electron sandbox
        run: |
          ELECTRON_BIN="$(node -e "process.stdout.write(require('electron'))")"
          SANDBOX_PATH="$(dirname "$ELECTRON_BIN")/chrome-sandbox"
          test -f "$SANDBOX_PATH"
          sudo chown root:root "$SANDBOX_PATH"
          sudo chmod 4755 "$SANDBOX_PATH"
          stat -c '%U %G %a %n' "$SANDBOX_PATH"

      - name: Verify source and tests
        run: npm run verify

      - name: Audit runtime dependencies
        run: npm run audit

      - name: Report build-tool audit findings
        continue-on-error: true
        run: npm run audit:full

      - name: Smoke test
        run: xvfb-run -a npm run smoke

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Create checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS-Linux.txt' -print0 |
            sort -z |
            xargs -0 -r sha256sum > SHA256SUMS-Linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RewindOS-Linux
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
